# Local full-stack: PostgreSQL + backend + resume pipeline in one compose.

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:latest
    container_name: ats-postgres
    restart: always
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "PGDATA=/var/lib/postgresql/data/pgdata"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Resume Pipeline (Node.js LLM Sidecar) ───────────────────
  resume-pipeline:
    build:
      context: ./resume-pipeline
      dockerfile: Dockerfile
    container_name: ats-resume-pipeline
    restart: always
    environment:
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      PORT: "3001"
      NODE_ENV: production
      ENABLE_SEMANTIC_SCORING: ${ENABLE_SEMANTIC_SCORING:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      TRACE_STORE_FILE: /app/data/traces.jsonl
      HF_HOME: /app/.cache/huggingface
    ports:
      - "3001:3001"
    volumes:
      - hf_cache:/app/.cache/huggingface
      - trace_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      resume-pipeline:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RESUME_PIPELINE_URL: http://resume-pipeline:3001
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:
    name: backend_postgres_data
  hf_cache:
    name: resume_pipeline_hf_cache
  trace_data:
    name: resume_pipeline_trace_data
