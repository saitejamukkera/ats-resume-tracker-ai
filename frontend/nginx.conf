server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend if needed (optional since frontend calls backend directly via URL)
    # location /api {
    #     proxy_pass http://backend:8080;
    # }
}
